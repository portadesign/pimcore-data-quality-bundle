user-management:
    permissions:
        portadesign_data_quality_report: 'Raport jakości danych'
'Data Quality': 'Jakość danych'
'Data Quality Configuration': 'Konfiguracja jakości danych'
'Target Class': 'Klasa docelowa'
'The Pimcore DataObject class this configuration''s rules are evaluated against, e.g. "Product".': 'Klasa DataObject, względem której oceniane są reguły tej konfiguracji, np. „Product”.'
'Rules': 'Reguły'
'Individual quality rules evaluated for this class.': 'Poszczególne reguły jakości oceniane dla tej klasy.'
'Data Quality Rule': 'Reguła jakości danych'
'Description (generated)': 'Opis (generowany)'
'Generated automatically from Target Key + Requirement Level + Weight + Active on save. Read-only.': 'Generowany automatycznie przy zapisie z pól Klucz docelowy, Poziom wymagań, Waga i Aktywna. Tylko do odczytu.'
'Dependent Objects': 'Obiekty zależne'
'Scope this rule to one or more DataObjects of any class (e.g. specific Channels and/or Categories). The rule applies only when the product is linked to ALL of the listed objects, not any one of them. Leave empty to apply the rule unconditionally.': 'Ogranicza regułę do jednego lub kilku DataObjects dowolnej klasy (np. konkretnych kanałów i/lub kategorii). Reguła obowiązuje tylko wtedy, gdy produkt jest powiązany ze WSZYSTKIMI wymienionymi obiektami, a nie tylko z jednym z nich. Pozostaw puste, aby reguła obowiązywała zawsze.'
'Target Key': 'Klucz docelowy'
'The core field or Classification Store key this rule checks. Data Object fields and Classification Store keys ("Field: "/"CS Key: " prefixes) are both offered - which kind it is gets inferred from the value, not chosen separately.': 'Pole obiektu lub klucz Classification Store sprawdzany przez tę regułę. Dostępne są zarówno pola Data Object, jak i klucze Classification Store (prefiksy „Pole: ”/„Klucz CS: ”) – rodzaj jest ustalany na podstawie wartości, a nie wybierany osobno.'
'Requirement Level': 'Poziom wymagań'
'mandatory rules determine the quality score; recommended/optional rules are reported but do not affect the score.': 'Reguły obowiązkowe decydują o wyniku jakości; reguły zalecane i opcjonalne są tylko raportowane i nie wpływają na wynik.'
'Mandatory': 'Obowiązkowa'
'Recommended': 'Zalecana'
'Optional': 'Opcjonalna'
'Weight': 'Waga'
'Relative weight of this rule within the mandatory-rule score calculation.': 'Względna waga tej reguły w obliczaniu wyniku z reguł obowiązkowych.'
'Active': 'Aktywna'
'Inactive rules are ignored during evaluation.': 'Nieaktywne reguły są pomijane podczas oceny.'
'Workflow Gates': 'Bramki workflow'
'Gates': 'Bramki'
'Workflow transitions blocked until the product passes the required quality level. Evaluates unscoped rules and rules of the product''s categories; channel rules never gate.': 'Przejścia workflow zablokowane, dopóki produkt nie osiągnie wymaganego poziomu jakości. Oceniane są reguły bez zakresu i reguły kategorii produktu; reguły kanałów nigdy nie blokują.'
'Data Quality Gate': 'Bramka jakości danych'
'Transition': 'Przejście'
'Workflow transition this gate blocks until the product passes the required quality level.': 'Przejście workflow blokowane przez tę bramkę, dopóki produkt nie osiągnie wymaganego poziomu jakości.'
'Required Level': 'Wymagany poziom'
'Which unsatisfied rules block the transition: mandatory only, or mandatory and recommended.': 'Które niespełnione reguły blokują przejście: tylko obowiązkowe czy obowiązkowe i zalecane.'
'Mandatory + Recommended': 'Obowiązkowe + zalecane'
'Inactive gates never block.': 'Nieaktywne bramki nigdy nie blokują.'
