user-management:
    permissions:
        portadesign_data_quality_report: 'Report kvality dat'
'Data Quality': 'Kvalita dat'
'Data Quality Configuration': 'Konfigurace kvality dat'
'Target Class': 'Cílová třída'
'The Pimcore DataObject class this configuration''s rules are evaluated against, e.g. "Product".': 'Třída DataObject, vůči které se vyhodnocují pravidla této konfigurace, např. „Product“.'
'Rules': 'Pravidla'
'Individual quality rules evaluated for this class.': 'Jednotlivá pravidla kvality vyhodnocovaná pro tuto třídu.'
'Data Quality Rule': 'Pravidlo kvality dat'
'Description (generated)': 'Popis (generovaný)'
'Generated automatically from Target Key + Requirement Level + Weight + Active on save. Read-only.': 'Generuje se automaticky při uložení z polí Cílový klíč, Úroveň požadavku, Váha a Aktivní. Jen pro čtení.'
'Dependent Objects': 'Závislé objekty'
'Scope this rule to one or more DataObjects of any class (e.g. specific Channels and/or Categories). The rule applies only when the product is linked to ALL of the listed objects, not any one of them. Leave empty to apply the rule unconditionally.': 'Omezí pravidlo na jeden nebo více DataObjects libovolné třídy (např. konkrétní kanály a/nebo kategorie). Pravidlo platí, jen když je produkt propojen se VŠEMI uvedenými objekty, nestačí jen některý z nich. Ponechte prázdné, aby pravidlo platilo vždy.'
'Target Key': 'Cílový klíč'
'The core field or Classification Store key this rule checks. Data Object fields and Classification Store keys ("Field: "/"CS Key: " prefixes) are both offered - which kind it is gets inferred from the value, not chosen separately.': 'Pole objektu nebo klíč Classification Store, který pravidlo kontroluje. Nabízejí se pole Data Object i klíče Classification Store (předpony „Pole: “/„Klíč CS: “) – o jaký typ jde, se odvodí z hodnoty, nevybírá se zvlášť.'
'Requirement Level': 'Úroveň požadavku'
'mandatory rules determine the quality score; recommended/optional rules are reported but do not affect the score.': 'Povinná pravidla určují skóre kvality; doporučená a volitelná pravidla se jen zobrazují a skóre neovlivňují.'
'Mandatory': 'Povinné'
'Recommended': 'Doporučené'
'Optional': 'Volitelné'
'Weight': 'Váha'
'Relative weight of this rule within the mandatory-rule score calculation.': 'Relativní váha tohoto pravidla ve výpočtu skóre z povinných pravidel.'
'Active': 'Aktivní'
'Inactive rules are ignored during evaluation.': 'Neaktivní pravidla se při vyhodnocení ignorují.'
'Workflow Gates': 'Brány workflow'
'Gates': 'Brány'
'Workflow transitions blocked until the product passes the required quality level. Evaluates unscoped rules and rules of the product''s categories; channel rules never gate.': 'Přechody workflow blokované, dokud produkt nesplní požadovanou úroveň kvality. Vyhodnocují se pravidla bez scope a pravidla kategorií produktu; pravidla kanálů bránu nikdy neblokují.'
'Data Quality Gate': 'Brána kvality dat'
'Transition': 'Přechod'
'Workflow transition this gate blocks until the product passes the required quality level.': 'Přechod workflow, který brána blokuje, dokud produkt nesplní požadovanou úroveň kvality.'
'Required Level': 'Požadovaná úroveň'
'Which unsatisfied rules block the transition: mandatory only, or mandatory and recommended.': 'Která nesplněná pravidla přechod blokují: jen povinná, nebo povinná a doporučená.'
'Mandatory + Recommended': 'Povinné + doporučené'
'Inactive gates never block.': 'Neaktivní brány nikdy neblokují.'
