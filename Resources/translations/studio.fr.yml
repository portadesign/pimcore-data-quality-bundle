user-management:
    permissions:
        portadesign_data_quality_report: 'Rapport de qualité des données'
'Data Quality': 'Qualité des données'
'Data Quality Configuration': 'Configuration de la qualité des données'
'Target Class': 'Classe cible'
'The Pimcore DataObject class this configuration''s rules are evaluated against, e.g. "Product".': 'La classe DataObject Pimcore sur laquelle les règles de cette configuration sont évaluées, p. ex. « Product ».'
'Rules': 'Règles'
'Individual quality rules evaluated for this class.': 'Règles de qualité individuelles évaluées pour cette classe.'
'Data Quality Rule': 'Règle de qualité des données'
'Description (generated)': 'Description (générée)'
'Generated automatically from Target Key + Requirement Level + Weight + Active on save. Read-only.': 'Générée automatiquement à l’enregistrement à partir de Clé cible, Niveau d’exigence, Poids et Actif. Lecture seule.'
'Dependent Objects': 'Objets dépendants'
'Scope this rule to one or more DataObjects of any class (e.g. specific Channels and/or Categories). The rule applies only when the product is linked to ALL of the listed objects, not any one of them. Leave empty to apply the rule unconditionally.': 'Limite cette règle à un ou plusieurs DataObjects de n’importe quelle classe (p. ex. des canaux et/ou catégories spécifiques). La règle s’applique uniquement si le produit est lié à TOUS les objets listés, pas seulement à l’un d’eux. Laissez vide pour appliquer la règle sans condition.'
'Target Key': 'Clé cible'
'The core field or Classification Store key this rule checks. Data Object fields and Classification Store keys ("Field: "/"CS Key: " prefixes) are both offered - which kind it is gets inferred from the value, not chosen separately.': 'Le champ de l’objet ou la clé Classification Store vérifié par cette règle. Les champs Data Object et les clés Classification Store (préfixes « Champ : »/« Clé CS : ») sont tous deux proposés – le type est déduit de la valeur et non choisi séparément.'
'Requirement Level': 'Niveau d’exigence'
'mandatory rules determine the quality score; recommended/optional rules are reported but do not affect the score.': 'Les règles obligatoires déterminent le score de qualité ; les règles recommandées et facultatives sont signalées mais n’affectent pas le score.'
'Mandatory': 'Obligatoire'
'Recommended': 'Recommandée'
'Optional': 'Facultative'
'Weight': 'Poids'
'Relative weight of this rule within the mandatory-rule score calculation.': 'Poids relatif de cette règle dans le calcul du score des règles obligatoires.'
'Active': 'Actif'
'Inactive rules are ignored during evaluation.': 'Les règles inactives sont ignorées lors de l’évaluation.'
'Workflow Gates': 'Verrous de workflow'
'Gates': 'Verrous'
'Workflow transitions blocked until the product passes the required quality level. Evaluates unscoped rules and rules of the product''s categories; channel rules never gate.': 'Transitions de workflow bloquées tant que le produit n’atteint pas le niveau de qualité requis. Sont évaluées les règles sans portée et les règles des catégories du produit ; les règles de canal ne bloquent jamais.'
'Data Quality Gate': 'Verrou de qualité des données'
'Transition': 'Transition'
'Workflow transition this gate blocks until the product passes the required quality level.': 'Transition de workflow bloquée par ce verrou tant que le produit n’atteint pas le niveau de qualité requis.'
'Required Level': 'Niveau requis'
'Which unsatisfied rules block the transition: mandatory only, or mandatory and recommended.': 'Quelles règles non satisfaites bloquent la transition : uniquement les obligatoires, ou les obligatoires et les recommandées.'
'Mandatory + Recommended': 'Obligatoires + recommandées'
'Inactive gates never block.': 'Les verrous inactifs ne bloquent jamais.'
