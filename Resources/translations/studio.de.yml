user-management:
    permissions:
        portadesign_data_quality_report: 'Datenqualitätsbericht'
'Data Quality': 'Datenqualität'
'Data Quality Configuration': 'Datenqualitätskonfiguration'
'Target Class': 'Zielklasse'
'The Pimcore DataObject class this configuration''s rules are evaluated against, e.g. "Product".': 'Die Pimcore-DataObject-Klasse, gegen die die Regeln dieser Konfiguration ausgewertet werden, z. B. „Product“.'
'Rules': 'Regeln'
'Individual quality rules evaluated for this class.': 'Einzelne Qualitätsregeln, die für diese Klasse ausgewertet werden.'
'Data Quality Rule': 'Datenqualitätsregel'
'Description (generated)': 'Beschreibung (generiert)'
'Generated automatically from Target Key + Requirement Level + Weight + Active on save. Read-only.': 'Wird beim Speichern automatisch aus Zielschlüssel, Anforderungsstufe, Gewichtung und Aktiv erzeugt. Schreibgeschützt.'
'Dependent Objects': 'Abhängige Objekte'
'Scope this rule to one or more DataObjects of any class (e.g. specific Channels and/or Categories). The rule applies only when the product is linked to ALL of the listed objects, not any one of them. Leave empty to apply the rule unconditionally.': 'Beschränkt diese Regel auf ein oder mehrere DataObjects beliebiger Klassen (z. B. bestimmte Kanäle und/oder Kategorien). Die Regel gilt nur, wenn das Produkt mit ALLEN aufgeführten Objekten verknüpft ist, nicht nur mit einem davon. Leer lassen, damit die Regel immer gilt.'
'Target Key': 'Zielschlüssel'
'The core field or Classification Store key this rule checks. Data Object fields and Classification Store keys ("Field: "/"CS Key: " prefixes) are both offered - which kind it is gets inferred from the value, not chosen separately.': 'Das Objektfeld oder der Classification-Store-Schlüssel, den diese Regel prüft. Angeboten werden sowohl Data-Object-Felder als auch Classification-Store-Schlüssel (Präfixe „Feld: “/„CS-Schlüssel: “) – um welche Art es sich handelt, wird aus dem Wert abgeleitet und nicht separat gewählt.'
'Requirement Level': 'Anforderungsstufe'
'mandatory rules determine the quality score; recommended/optional rules are reported but do not affect the score.': 'Pflichtregeln bestimmen den Qualitätswert; empfohlene und optionale Regeln werden nur angezeigt und beeinflussen den Wert nicht.'
'Mandatory': 'Pflicht'
'Recommended': 'Empfohlen'
'Optional': 'Optional'
'Weight': 'Gewichtung'
'Relative weight of this rule within the mandatory-rule score calculation.': 'Relative Gewichtung dieser Regel bei der Berechnung des Werts aus den Pflichtregeln.'
'Active': 'Aktiv'
'Inactive rules are ignored during evaluation.': 'Inaktive Regeln werden bei der Auswertung ignoriert.'
'Workflow Gates': 'Workflow-Sperren'
'Gates': 'Sperren'
'Workflow transitions blocked until the product passes the required quality level. Evaluates unscoped rules and rules of the product''s categories; channel rules never gate.': 'Workflow-Übergänge, die gesperrt sind, bis das Produkt die erforderliche Qualitätsstufe erreicht. Ausgewertet werden Regeln ohne Einschränkung und Regeln der Produktkategorien; Kanalregeln sperren nie.'
'Data Quality Gate': 'Datenqualitätssperre'
'Transition': 'Übergang'
'Workflow transition this gate blocks until the product passes the required quality level.': 'Workflow-Übergang, den diese Sperre blockiert, bis das Produkt die erforderliche Qualitätsstufe erreicht.'
'Required Level': 'Erforderliche Stufe'
'Which unsatisfied rules block the transition: mandatory only, or mandatory and recommended.': 'Welche nicht erfüllten Regeln den Übergang blockieren: nur Pflichtregeln oder Pflicht- und empfohlene Regeln.'
'Mandatory + Recommended': 'Pflicht + empfohlen'
'Inactive gates never block.': 'Inaktive Sperren blockieren nie.'
